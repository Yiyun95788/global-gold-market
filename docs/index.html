<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gold Chronicle - Special Edition</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Merriweather:wght@300;400;700&family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FullPage CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/3.0.9/fullpage.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container-fluid">
        <div id="fullpage">
            
            <!-- Page 1: Home -->
            <div class="section" id="home-page">
            </div>
            
            <!-- Page 2: The Paradox - Correlation Heatmap -->
            <div class="section" id="viz-paradox">
                <div id="paradox-content"></div>
            </div>
            
            <!-- Page 3: Historical Context - River Chart -->
            <div class="section" id="viz-history">
                <div id="history-content"></div>
            </div>
            
            <!-- Page 4: Transition Page -->
            <div class="section" id="transition-page">
            </div>
            
            <!-- Page 5: Balance Text -->
            <div class="section" id="balance-text-page">
                <div id="balance-text-content"></div>
            </div>
            
            <!-- Page 6: Balance Visualization -->
            <div class="section" id="viz-balance">
                <div id="balance-content"></div>
            </div>
            
            <!-- Page 7: Map Text -->
            <div class="section" id="map-text-page">
                <div id="map-text-content"></div>
            </div>
            
            <!-- Page 8: Map Visualization -->
            <div class="section" id="viz-map">
                <div id="map-content"></div>
            </div>
            
            <!-- Page 9: Regime Text -->
            <div class="section" id="regime-text-page">
                <div id="regime-text-content"></div>
            </div>
            
            <!-- Page 10: Regime Visualization -->
            <div class="section" id="viz-regime">
                <div id="regime-content"></div>
            </div>
            
            <!-- Page 11: Conclusion -->
            <div class="section" id="conclusion-page">
            </div>
            
        </div>
    </div>
    
    <!-- Libraries -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/3.0.9/fullpage.js"></script>
    
    <!-- Custom JS -->
    <script src="js/init.js"></script>
    <script src="js/home.js"></script>
    <script src="js/paradox.js"></script>
    <script src="js/history.js"></script>
    <script src="js/transition.js"></script>
    <script src="js/vis2.js"></script>
    <script src="js/balance-text.js"></script>
    <script src="js/balance.js"></script>
    <script src="js/vis3.js"></script>
    <script src="js/map-text.js"></script>
    <script src="js/map.js"></script>
    <script src="js/script.js"></script>
    <script src="js/regime-text.js"></script>
    <script src="js/regime.js"></script>
    <script src="js/conclusion.js"></script>
    
    <script>
        new fullpage('#fullpage', {
            licenseKey: 'OPEN-SOURCE-GPLV3-LICENSE',
            anchors: ['home', 'paradox', 'history', 'transition', 'balance-text', 'balance', 'map-text', 'map', 'regime-text', 'regime', 'conclusion'],
            autoScrolling: false,
            scrollingSpeed: 700,
            fitToSection: false,
            navigation: true,
            navigationPosition: 'right',
            navigationTooltips: ['Home', 'The Paradox', 'Historical Context', 'Power Shift', 'Balance of Power', 'Balance Scale', 'Geographic Reality', 'Reserve Map', 'Market Regimes', 'Regime Quilt', 'Conclusion'],
            normalScrollElements: '#viz2-left-panel',
            scrollBar: true,
            onLeave: function(origin, destination){
                destination.item.classList.add('load-background');
                
                // Reset tutorial if leaving the balance page
                if (origin.anchor === 'balance' && window.balanceTutorial) {
                    if (window.balanceTutorial.isActive) {
                        window.balanceTutorial.reset();
                        
                        // Reset button states
                        if (window.balanceTutorialControls) {
                            window.balanceTutorialControls.tutorialBtn.textContent = '▶ TUTORIAL';
                            window.balanceTutorialControls.backBtn.style.display = 'none';
                            window.balanceTutorialControls.forwardBtn.style.display = 'none';
                        }
                        
                        // Clean up any remaining tutorial overlays
                        document.querySelectorAll('div[style*="z-index: 10001"]').forEach(overlay => {
                            if (overlay.style.position === 'fixed' && 
                                (overlay.style.background && overlay.style.background.includes('rgba(0, 0, 0, 0.7)') ||
                                 overlay.style.background && overlay.style.background.includes('rgba(76, 175, 80'))) {
                                if (typeof overlay.__overlayCleanup === 'function') {
                                    overlay.__overlayCleanup();
                                }
                                overlay.remove();
                            }
                        });
                    }
                }
            }
        });
        
        // Scroll reveal animation
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.scroll-reveal');
            
            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const revealPoint = 150;
                
                if (elementTop < windowHeight - revealPoint) {
                    element.classList.add('revealed');
                }
            });
        }
        
        window.addEventListener('scroll', revealOnScroll);
        revealOnScroll();
    </script>
</body>
</html>
